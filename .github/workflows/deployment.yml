name: Github Actions Artifact Demo
on:
    push:
        branches:
            - dev
            - main
        tags:
            - 'v*'
    pull_request:
        branches:
            - main
            - release/*
    workflow_dispatch:
    schedule:
        - cron: '0 9 * * *' # every day at 9am UTC
env:
    NODE_Version: 20
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v6
            - name: Setup code
              uses: actions/setup-node@v4
              with:
                node-version: ${{ env.NODE_Version }}
            - name: Install dependencies
              run: npm ci
            - name: Lint Code   
              run: npm run lint
            - name: Test Code
              run: npm test

